# Netlify Configuration for CACZ Frontend
[build]
  base = "web"
  publish = "dist"
  command = "npm run build"

# API Reverse Proxy: Forward /api/* requests to the Render C++ backend service
[[redirects]]
  from = "/api/*"
  to = "https://context-aware-hybrid-compressor.onrender.com/api/:splat"
  status = 200
  force = true

# Single-Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
